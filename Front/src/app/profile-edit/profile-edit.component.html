<form #editForm="ngForm" (ngSubmit)="onSubmit(editForm)">
  <div class="formulaire">
    <h1 >Modifier le profile</h1>
  <div class="ligne">
  <div><label for="employeName">Username</label> <br>
  <input id="employeName" name="employeName" ngModel [(ngModel)]="user.employeName" required> <br> </div>
  <div><label for="email">Email</label> <br>
  <input id="email" name="email" ngModel [(ngModel)]="user.email" readonly> <br> </div>
  </div>

  <div class="ligne">
  <div><label for="place">Place</label> <br>
  <input id="place" name="place" ngModel [(ngModel)]="user.place" required> <br> </div>
  <div><label for="password">New Password</label> <br>
  <input id="password" name="password" ngModel [(ngModel)]="user.password" type="password"> <br> </div>
  </div>

  <div class="ligne">
  <div><label for="description">Description</label> <br>
  <textarea id="description" name="description" ngModel [(ngModel)]="user.description"></textarea> <br></div>
  <div><label for="phone">Telephone</label> <br>
  <input id="phone" name="phone" ngModel [(ngModel)]="user.phone"> <br> </div>
  </div>

  <h4>Modifier Photo de profile</h4>
  <input id="profilePhoto" type="file" (change)="handleProfilePhotoInput($event)" accept="image/*"> <br>
  <br>
  <h4>Ajouter des photos</h4>
  <input id="workPhotos" type="file" (change)="handleWorkPhotosInput($event)" multiple> <br>
  <h4>Supprimer des photos</h4>
  <div class="imgvid">
  <div *ngFor="let photo of user.photoUrls; let i = index">
    <div class="delete"><img [src]="'http://localhost:5239/' + photo" alt="work photo" width="100">
    <i class="fa-solid fa-trash" (click)="removePhoto(i)"></i></div>
  </div> </div>

  <h4> Ajouter des videos</h4>
  <input id="workVideos" type="file" (change)="handleWorkVideosInput($event)" multiple> <br>
  <h4>Supprimer des videos</h4>
  <div class="imgvid">
  <div *ngFor="let video of user.videoUrls; let i = index">
    <div class="delete"><video [src]="'http://localhost:5239/' + video" controls width="200"></video>
    <i class="fa-solid fa-trash" (click)="removeVideo(i)"></i> </div>
  </div> </div>
  </div>
  <div class="buttons">
    <button type="submit" style="background-color: green;">Modifier</button>
    <button type="submit" click="annuler()" style="background-color: red;">Annuler</button>
  </div>
</form>
