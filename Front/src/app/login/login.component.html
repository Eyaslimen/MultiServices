<form (ngSubmit)="onSubmit2()">
  <h1>Se connecter</h1>
    <label for="username">Username</label>
    <input type="text" [(ngModel)]="userLogin.username" name="username" required/>
    <label for="password">Password</label>
    <input type="password" [(ngModel)]="userLogin.password" name="password" required/>
    <button type="submit">Se connecter</button> <br>
    <div class="register"><p>Vous avez pas encore un compte ?</p><a href="http://localhost:4200/register">register</a></div>
  </form>
